version: "3.9"

services:
  auth:
    image: registry.problemka-mtuci.tech/auth:dev
    env_file:
      - ../env/.env
    ports:
      - "8001:8000"
    restart: always
    networks:
      - backend

  reports:
    image: registry.problemka-mtuci.tech/reports:dev
    env_file:
      - ../env/.env
    ports:
      - "8002:8000"
    restart: always
    networks:
      - backend

  notification:
    image: registry.problemka-mtuci.tech/notification:dev
    env_file:
      - ../env/.env
    ports:
      - "8003:8000"
    restart: always
    networks:
      - backend

  # ── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: always
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.problemka-mtuci.tech
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: always
    networks:
      - backend

  loki:
    image: grafana/loki:latest
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    restart: always
    networks:
      - backend

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    restart: always
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
