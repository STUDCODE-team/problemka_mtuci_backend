[tool.poetry]
name = "common"
version = "0.1.0"
description = "Shared utilities and base models for all microservices"
authors = ["piksi <pitelinaksenia83412@gmail.com>"]
packages = [{ include = "common_lib", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.8.0"
sqlalchemy = "^2.0.22"      # (если используешь модели SQLAlchemy)
typing-extensions = "^4.12" # иногда нужно для Pydantic 2+
loguru = "^0.7.2"
pydantic-settings = "^2.0"
asyncpg = "^0.30.0"
redis = { extras = ["async"], version = "^5.0" }
httpx = "^0.27.0"
aio-pika = "^9.4"
opentelemetry-sdk = "^1.25.0"
opentelemetry-exporter-otlp-proto-grpc = "^1.25.0"
opentelemetry-instrumentation-sqlalchemy = "^0.46b0"
opentelemetry-instrumentation-httpx = "^0.46b0"
setuptools = "<81"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
